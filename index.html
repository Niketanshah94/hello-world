<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ProtoBuzz</title>
<meta name="description" content="The internet tests your idea before you waste months building it." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Mobile top bar -->
  <header class="topbar" id="topbar">
    <a class="brand" href="#/discover" aria-label="ProtoBuzz home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 26" focusable="false"><path d="M12 1 22.4 7v12L12 25 1.6 19V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.6 15.4c1.6-3.4 3.2-3.4 4.8 0s3.2 3.4 4.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-word">ProtoBuzz</span>
    </a>
    <div class="topbar-right">
      <button class="credit-pill" id="credit-pill-mobile" type="button" data-route="#/lab">
        <span class="credit-coin" aria-hidden="true"></span>
        <span class="credit-count" data-credits>15</span>
        <span class="sr-only">credits</span>
      </button>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="Switch theme">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 2.5v15M10 6a4 4 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <!-- Desktop left rail -->
    <nav class="rail" aria-label="Primary">
      <a class="brand rail-brand" href="#/discover">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 26" focusable="false"><path d="M12 1 22.4 7v12L12 25 1.6 19V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.6 15.4c1.6-3.4 3.2-3.4 4.8 0s3.2 3.4 4.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-word">ProtoBuzz</span>
      </a>
      <ul class="rail-nav" id="rail-nav"></ul>
      <div class="rail-foot">
        <button class="rail-link" data-theme-toggle type="button" style="width:100%">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 2.5v15M10 6a4 4 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Theme</span>
        </button>
        <div class="credit-card" data-route="#/lab" role="button" tabindex="0">
          <div class="credit-card-top">
            <span class="credit-coin" aria-hidden="true"></span>
            <span class="credit-card-num" data-credits>15</span>
            <span class="credit-card-label">credits</span>
          </div>
          <div class="credit-bar"><i data-credit-bar style="width:75%"></i></div>
          <p class="credit-card-hint" data-credit-hint>5 more to launch a prototype</p>
          <div class="credit-card-actions">
            <button class="credit-mini" data-go="#/test" type="button">Earn</button>
            <button class="credit-mini buy" data-buy-credits="Add credits" type="button">Buy</button>
          </div>
        </div>
      </div>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>

    <!-- Desktop right rail -->
    <aside class="aside" id="aside" aria-label="Highlights"></aside>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="bottomnav" id="bottomnav" aria-label="Primary"></nav>

  <!-- Overlays -->
  <div class="sheet-root" id="sheet-root" hidden></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <div class="spark-root" id="spark-root" aria-hidden="true"></div>

  <script src="src/data.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
